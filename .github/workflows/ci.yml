name: CI

on:
  push:
    branches: [main]
  pull_request:

# As VITE_* são públicas (vão para o bundle). Cadastre em Settings > Secrets and variables > Actions > Variables.
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

jobs:
  check:
    name: Testes, typecheck e orçamentos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Testes (front e Edge Functions)
        run: npm test
      - name: Build (tsc + vite + orçamentos de JS)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  lighthouse:
    name: Lighthouse (celular, mediana de 3)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx -y @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/reports
